name = "claude-pokemon-api"
main = "src/index.ts"
compatibility_date = "2026-05-05"
workers_dev = true

# Disable observability/logging entirely — we don't want IPs in CF logs.
# (Workers Logs are off by default but explicit here for safety.)
[observability]
enabled = false

# Public, non-secret values. GitHub OAuth client_id is exposed in the browser
# authorize URL anyway, so it's safe to commit. The matching client_secret is a
# wrangler secret (NOT here) : `npx wrangler secret put GITHUB_CLIENT_SECRET`.
[vars]
GITHUB_CLIENT_ID = "Ov23liiZGFKFIT78EDcz"

# KV namespace bound as `env.STATS`. The `id` is filled after running:
#   wrangler kv namespace create STATS
[[kv_namespaces]]
binding = "STATS"
id = "c5e69cf5ee87443786b562ab4dffd347"
