name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pipeline shape (mirrors GitLab-style stages, fail-fast across stages) :
#
#   security ──► quality (parallel: shellcheck / json+drift+parity / api-lint /
#                                  api-prettier / api-typecheck) ──► test
#                                  (cli bats + api vitest + install-dry-run) ──► package (npm pack)
#
# Two sides share the pipeline : the bash CLI (lib/, bin/) and the api/ worker
# (TypeScript, vitest). Each side's gates live in its own stage to keep the
# DAG readable.

env:
  NODE_VERSION: '20'

jobs:
  # ─── Stage : security ─────────────────────────────────────────────────────
  security-root:
    name: 🔒 npm audit (root devDeps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (high+)
        run: npm audit --audit-level=high || echo "::warning::root deps have audit findings"

  security-api:
    name: 🔒 npm audit (api/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: npm audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high

  # ─── Stage : quality — bash side ──────────────────────────────────────────
  bash-shellcheck:
    name: 🐛 Bash — shellcheck (errors only)
    needs: [security-root]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Runtime is bash-free (R3d-6); only the maintainer build scripts remain.
      - run: shellcheck -S error lib/build-data.sh scripts/build-sprites.sh scripts/ci-pre-push.sh

  bash-json:
    name: 🌍 Data JSON validate + locale parity + build drift
    needs: [security-root]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get install -y jq
      - name: Validate data.default.json + split sources
        run: |
          jq empty lib/data.default.json
          for f in lib/data/config.json lib/data/thresholds.json \
                   lib/data/seasons.json lib/data/items.json lib/data/berries.json \
                   lib/data/special/*.json lib/data/lineages/*.json \
                   lib/data/wild_pool/*.json; do
            jq empty "$f"
          done
      - name: Verify data.default.json is in sync with sources
        run: |
          bash lib/build-data.sh
          if ! git diff --exit-code lib/data.default.json; then
            echo "::error::lib/data.default.json is stale. Run \`npm run build:data\` and commit."
            exit 1
          fi
      - name: Verify shared generated data is in sync (species types + learnsets)
        run: |
          node shared/scripts/build-species-combat-type.mjs
          node shared/scripts/build-learnsets.mjs
          if ! git diff --exit-code shared/src/species-combat-type.generated.ts shared/src/learnsets.generated.ts; then
            echo "::error::shared generated data is stale. Run \`npm run build:data\` and commit."
            exit 1
          fi
      - name: Validate locales JSON
        run: |
          jq empty lib/locales/fr.json
          jq empty lib/locales/en.json
      - name: Enforce FR ↔ EN locale parity
        run: |
          fr_keys=$(jq -r 'paths(scalars) | join(".")' lib/locales/fr.json | sort -u)
          en_keys=$(jq -r 'paths(scalars) | join(".")' lib/locales/en.json | sort -u)
          missing_in_en=$(comm -23 <(echo "$fr_keys") <(echo "$en_keys"))
          missing_in_fr=$(comm -13 <(echo "$fr_keys") <(echo "$en_keys"))
          if [ -n "$missing_in_en" ] || [ -n "$missing_in_fr" ]; then
            [ -n "$missing_in_en" ] && echo "::error::Missing in en.json:" && echo "$missing_in_en"
            [ -n "$missing_in_fr" ] && echo "::error::Missing in fr.json:" && echo "$missing_in_fr"
            exit 1
          fi

  # ─── Stage : quality — api side ───────────────────────────────────────────
  api-lint:
    name: 🐛 api — ESLint
    needs: [security-api]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint

  api-prettier:
    name: 💅 api — Prettier check
    needs: [security-api]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run format:check

  api-typecheck:
    name: 🚨 api — TypeScript typecheck
    needs: [security-api]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # ─── Stage : quality — shared package ─────────────────────────────────────
  shared-tests:
    name: ✅ shared — typecheck + Vitest
    needs: [security-root]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run -w shared typecheck
      - run: npm run -w shared test
      - name: Verify shared dist + committed bundles are in sync with sources
        run: |
          npm run -w shared build:gen
          npm run -w shared build:engine
          if ! git diff --exit-code shared/dist shared/src/species-combat-type.generated.ts shared/src/learnsets.generated.ts lib/statusline.mjs lib/pokemon.mjs; then
            echo "::error::shared dist/generated/bundles stale. Run \`npm run build:data && npm run -w shared build:engine\` and commit."
            exit 1
          fi

  # ─── Stage : test ─────────────────────────────────────────────────────────
  cli-tests:
    name: ✅ CLI smoke tests (Bats)
    needs: [bash-shellcheck, bash-json]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: sudo apt-get install -y jq && npm ci
      - run: npm test

  install-dry-run:
    name: ✅ Install dry-run (syntax + structure)
    needs: [bash-shellcheck, bash-json]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Node-native install tooling (R3d-6 — bash-free) — syntax check.
      - run: for f in install update uninstall status export import; do node --check "bin/$f.mjs"; done
      - run: node --check bin/claude-pokemon
      - name: Verify required files
        run: |
          test -f lib/statusline.mjs
          test -f lib/pokemon.mjs
          test -f lib/data.default.json
          test -f lib/locales/fr.json
          test -f lib/locales/en.json
          test -f skills/pokemon/SKILL.md
          # Sprites must ship pre-rendered (R3d-5 — no chafa at install).
          test -f lib/sprites/normal/charmander.txt
          test -f lib/sprites-mini/normal/charmander.txt
          n=$(find lib/sprites lib/sprites-mini -name '*.txt' | wc -l)
          test "$n" -eq 148 || { echo "expected 148 sprite .txt, found $n"; exit 1; }
          echo "✓ All required files present (incl. $n pre-rendered sprites)"

  api-tests:
    name: ✅ api — Vitest + coverage
    needs: [api-lint, api-prettier, api-typecheck]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  # ─── Stage : quality + test + build — web side (Nuxt arena) ───────────────
  # Web jobs pin Node 22 (web's @nuxt/eslint → eslint-flat-config-utils calls
  # Object.groupBy, Node 21+). `npm ci` at root installs the whole workspace
  # (incl. shared's build via prepare + web's nuxt prepare); `-w web` runs each
  # script with web/ as cwd. No submodule checkout — shared is a workspace dep.
  web-lint:
    name: 🐛 web — ESLint
    needs: [security-root]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run -w web lint

  web-prettier:
    name: 💅 web — Prettier check
    needs: [security-root]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run -w web format:check

  web-typecheck:
    name: 🚨 web — TypeScript typecheck
    needs: [security-root]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run -w web typecheck

  web-knip:
    name: 🔍 web — Dead code (knip)
    needs: [security-root]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run -w web knip

  web-i18n:
    name: 🌍 web — i18n FR/EN parity
    needs: [security-root]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run -w web check:i18n

  web-tests:
    name: ✅ web — Vitest + coverage (80%)
    needs: [web-lint, web-prettier, web-typecheck, web-knip, web-i18n]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run -w web test:coverage

  web-build:
    name: 📦 web — Nuxt build (cloudflare-pages preset)
    needs: [web-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Build for Cloudflare Pages
        env:
          NITRO_PRESET: cloudflare-pages
        run: npm run -w web build
      - name: Verify dist output
        run: |
          test -d web/dist || (echo "::error::web/dist not generated" && exit 1)
          ls -la web/dist | head -20

  # ─── Stage : packaging ────────────────────────────────────────────────────
  npm-pack:
    name: 📦 npm pack — verify packaging
    needs: [cli-tests, install-dry-run, api-tests, shared-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm pack --dry-run
